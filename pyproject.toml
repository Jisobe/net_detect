[project]
name = "netdiag"
version = "0.1.0"
description = "ML and RAG assistant for wired network fault diagnosis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "requests",
    "beautifulsoup4",
    "pypdf",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
netdiag = "netdiag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Modules live directly under src/ and are installed as the `netdiag` package.
[tool.setuptools]
package-dir = {"netdiag" = "src"}
packages = ["netdiag", "netdiag.kb", "netdiag.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
